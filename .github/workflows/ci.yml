name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit subjects
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
              revision_range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
              revision_range="$GITHUB_SHA"
          else
              revision_range="${PUSH_BEFORE_SHA}..${GITHUB_SHA}"
          fi
          sh .githooks/commit-msg --revision-range "$revision_range"

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run CPU-only CTest tests
        run: ctest --test-dir build -C Release --output-on-failure -L cpu
