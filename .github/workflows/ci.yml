name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit subjects
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ($env:EVENT_NAME -eq "pull_request") {
              $revisionRange = "$($env:PR_BASE_SHA)..$($env:PR_HEAD_SHA)"
          }
          elseif ($env:PUSH_BEFORE_SHA -match "^0+$") {
              $revisionRange = $env:GITHUB_SHA
          }
          else {
              $revisionRange = "$($env:PUSH_BEFORE_SHA)..$($env:GITHUB_SHA)"
          }
          & .\scripts\check-commit-messages.ps1 -RevisionRange $revisionRange

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run CPU-only CTest tests
        run: ctest --test-dir build -C Release --output-on-failure -L cpu
